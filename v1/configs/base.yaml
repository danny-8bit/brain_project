# 通用配置
seed: 2024
gpu: 0
amp: true
deep_supervision: true
ema: true
grad_clip: 1.0

# 数据
data_root: ./data/BraTS2021_TrainingData
folds_json: ./data/folds.json
num_folds: 5
num_workers: 4
cache_rate: 0.0      # 数据较大，建议 0.0；显存大于 64GB 可设 0.2

# 训练
roi_size: [128, 128, 128]
batch_size: 2
sw_batch_size: 4
max_epochs: 500
val_interval: 10
lr: 1.0e-4
weight_decay: 1.0e-5

# 输出
work_dir: ./work_dir